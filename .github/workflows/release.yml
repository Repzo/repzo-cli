name: Release Repzo CLI

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check

  build:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        target:
          - bun-darwin-arm64
          - bun-darwin-x64
          - bun-linux-arm64
          - bun-linux-x64
          - bun-windows-arm64
          - bun-windows-x64
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.5
      - name: Validate release version
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          package_version="$(node -p "require('./package.json').version")"
          test "$version" = "$package_version"
      - run: npm run skill:embed
      - name: Build standalone executable
        run: node scripts/build-standalone.mjs --target=${{ matrix.target }} --outdir=dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: repzo-${{ matrix.target }}
          path: dist/repzo_*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          pattern: repzo-*
          path: dist
          merge-multiple: true
      - uses: sigstore/cosign-installer@f713795cb21599bc4e5c4b58cbad1da852d7eeb9 # v3
      - name: Create checksums and signature
        working-directory: dist
        run: |
          sha256sum repzo_* > checksums.txt
          cosign sign-blob --yes --new-bundle-format=true --bundle checksums.txt.bundle checksums.txt
      - name: Attest build provenance
        uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661 # v3
        with:
          subject-checksums: dist/checksums.txt
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          name: Repzo CLI ${{ github.ref_name }}
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-rc.') || contains(github.ref_name, '-beta.') || contains(github.ref_name, '-alpha.') }}
          files: |
            dist/repzo_*
            dist/checksums.txt
            dist/checksums.txt.bundle

  verify:
    name: Verify released binary (${{ matrix.os }})
    needs: release
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux_x64
            extension: ""
          - os: macos-14
            platform: darwin_arm64
            extension: ""
          - os: windows-latest
            platform: windows_x64
            extension: ".exe"
    steps:
      - name: Download and verify release asset
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          asset="repzo_${version}_${{ matrix.platform }}${{ matrix.extension }}"
          mkdir -p verify
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --pattern "$asset" --pattern checksums.txt --dir verify
          cd verify
          expected=$(awk -v name="$asset" '$2 == name || $2 == ("*" name) { print $1; exit }' checksums.txt)
          if command -v sha256sum >/dev/null 2>&1; then
            actual=$(sha256sum "$asset" | awk '{print $1}')
          else
            actual=$(shasum -a 256 "$asset" | awk '{print $1}')
          fi
          test -n "$expected" && test "$expected" = "$actual"
          chmod +x "$asset"
          test "$(./$asset --version)" = "$version"
